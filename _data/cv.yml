cv:
  name: Ramendra Kumar
  label: SDE-II at Microsoft
  location: Hyderabad, India
  image: ""
  summary: Engineer with 6+ years of experience spanning systems engineering, high-throughput media pipelines, and large-scale infrastructure. Passionate about building AI-powered systems that operate reliably in production. M.S. in Computer Science from UT Austin.

  social_networks:
