cv:
  name: Ramendra Kumar
  label: Systems & AI Infrastructure Engineer
  location: Hyderabad, India
  image: ""
  summary: Engineer with 6+ years progressing from systems engineering and high-throughput media pipelines to large-scale infrastructure and AI systems. Currently at Microsoft building AI-powered device health monitoring and autonomous remediation for 10,000+ Windows endpoints. MS in CS from UT Austin (3.9/4.0).

  social_networks:
    - network: GitHub
      username: ramendra-k
    - network: LinkedIn
      username: ramendrakumar

  sections:
    Experience:
      - company: Microsoft
        position: SDE-II
        location: Hyderabad, India
        start_date: 2024-07
        end_date: "Present"
        summary: Post Launch Engineering — Surface ARM devices
        highlights:
          - "Owned Windows Update delivery pipelines for ARM-based devices across 9 SKUs and 3 chipsets — monitored update health across 10,000+ device fleet, built telemetry-driven regression detection, and maintained build pipeline reliability of drivers and firmware across release cycles."
          - "Drove end-to-end Surface device reliability — diagnosed customer-facing firmware/software issues through root-cause analysis across drivers and OS layers. Analyzed large-scale Windows telemetry to identify failure patterns and validate fixes before broad rollout."
          - "Architected HealthSenseAI, a fleet-scale health monitoring platform for 10,000+ Windows endpoints with real-time telemetry ingestion and 24 health checkers — replacing manual per-device debugging with a centralized dashboard. Built an autonomous self-heal engine using agentic AI with causal root-cause analysis, domain-specific repair skills, and bounded remediation. Achieved 29% auto-fix rate across 19 issue types."
          - "Resolved an NPU resource leak in the Windows Hello face-recognition pipeline — the Neural Processing Unit was not deallocated after sign-in, causing sustained high utilization for ~1 hour post-restart. Root-caused via telemetry analysis and driver-level debugging on AI-accelerator silicon."
          - "Built PLE Echo, an AI onboarding assistant — fine-tuned Mistral-7B with LoRA/PEFT on team docs, built a FAISS-indexed RAG pipeline, and deployed as a web app to reduce repeated knowledge-transfer overhead from senior engineers."
          - "Mentored 2 new-hire engineers on codebase, debugging workflows, and fleet health tooling."

      - company: Samsung R&D
        position: Senior Software Engineer
        location: Bangalore, India
        start_date: 2022-01
        end_date: 2024-06
        summary: ExpertRaw Camera App — Image Processing Pipeline
        highlights:
          - "Owned the image processing pipeline for ExpertRaw, Samsung's flagship camera app (~3M active users), working at the Android framework layer across S22/S23 series devices."
          - "Designed a cloud-based compute offloading service for image rendering, enabling flagship-grade image quality on mid-tier devices with limited on-device processing power."
          - "Built the 50MP capture and processing framework, handling high-resolution frame buffers with optimized memory management and pipeline throughput to prevent OOM crashes on constrained devices."
          - "Engineered a priority-based processing scheduler — replaced LIFO ordering with user-intent-aware scheduling, reducing time-to-preview for the most recent capture."
          - "Developed Astrography and multi-exposure capture modes — shipped in flagship releases for night-sky photography and scene superimposition."

      - company: BigGrocers
        position: Software Engineer
        location: Bangalore, India
        start_date: 2021-07
        end_date: 2021-12
        highlights:
          - "Built REST backend services for order aggregation, placement, tracking, and UPI payment gateway integration."

      - company: Qualcomm
        position: Associate Software Engineer
        location: Hyderabad, India
        start_date: 2019-09
        end_date: 2021-01
        highlights:
          - "Optimized a display driver algorithm for low-cost chipsets — achieved 2× refresh rate improvement (30Hz → 60Hz at 4K HDR on HDMI) while reducing resource consumption, enabling flagship display capabilities on budget silicon."
          - "Developed at the hardware-software co-optimization layer, directly interfacing with display hardware, HDMI protocols, and hardware abstraction layers."

    Education:
      - institution: The University of Texas at Austin
        location: Austin, TX
        area: Computer Science
        studyType: M.S.
        start_date: 2024-08
        end_date: 2026-05
        score: "3.9/4.0"
        courses: "Deep Learning, Machine Learning, Reinforcement Learning, NLP, Advanced Deep Learning, Advanced Operating Systems, Planning Search & Reasoning Under Uncertainty, Optimization, Online Learning"

      - institution: Jadavpur University
        location: Kolkata, India
        area: Electronics & Instrumentation Engineering
        studyType: B.E.
        start_date: 2015-08
        end_date: 2019-05
        score: "7.6/10.0"

    Awards:
      - title: Engineering Excellence Award
        date: 2025
        awarder: Microsoft
        summary: "For delivering HealthSenseAI from proof-of-concept to production."

      - title: Quarterly Impact Award
        date: 2023
        awarder: Samsung R&D
        summary: "For outstanding contributions to the Astrography capture feature in ExpertRaw camera framework."

    Publications:
      - title: "A Computer Vision-Based Fire Detection and Control System"
        authors:
          - Ramendra Kumar
        publisher: "Springer — Fire Technology"
        releaseDate: 2023
        url: https://link.springer.com/article/10.1007/s10694-023-01392-w
        summary: "Real-time fire detection on Raspberry Pi using image processing. Achieved 95.26% accuracy — 7.95% improvement over prior algorithms."

      - title: "Debiasing Natural Language Inference Models Using a Product of Experts Approach"
        authors:
          - Ramendra Kumar
        publisher: "UT Austin — Selected Research"
        releaseDate: 2025
        summary: "PoE debiasing framework with ELECTRA-small; improved robustness on SNLI and HANS benchmarks by reducing shortcut dependence."

      - title: "Detecting Integrity Events in Airbnb's Sparse Data Streams"
        authors:
          - Ramendra Kumar
        publisher: "UT Austin — Selected Research"
        releaseDate: 2025
        summary: "Semantic Neural Hawkes Process (S-NHP) for integrity detection over sparse textual signals; substantially reduced false positives vs. memoryless baselines."

    Skills:
      - name: ML & AI
        level: ""
        icon: fa-solid fa-robot
        keywords: "PyTorch, Transformers, Ray, Spark, Kubeflow, vLLM, ONNX, LLM Fine-tuning, Agentic AI Systems, Agent Harness, MLOps, Collaborative Filtering, Recommendation Systems"

      - name: Systems & Infra
        level: ""
        icon: fa-solid fa-server
        keywords: "Linux, Kubernetes, Docker, Distributed Systems, GPU/NPU Debugging, Kafka, Redis, CI/CD"

      - name: Languages
        level: ""
        icon: fa-solid fa-code
        keywords: "Python, C/C++, Java"

    Projects:
      - name: HealthSenseAI Self-Heal Engine
        summary: "Autonomous agentic system: 24 health checkers → causal root-cause analysis → skill-scoped AI agent → bounded repair → deterministic verification. Full audit trail. Circuit breaker for AI backend resilience. PII redaction layer."
        highlights:
          - "Python, Azure OpenAI, asyncio"
          - "29% auto-fix rate across 19 issue types"
        start_date: 2024
        end_date: ""

      - name: PLE Echo — AI Onboarding Agent
        summary: "Fine-tuned 7B-parameter LLM on internal team documentation using LoRA/PEFT. Built FAISS-indexed RAG pipeline with BGE-large embeddings. Deployed as web application for team-wide use."
        highlights:
          - "Python, PyTorch, Mistral-7B, Flask"
        start_date: 2024
        end_date: ""

      - name: Fire Detection & Control System
        summary: "Raspberry Pi-based real-time fire detection using image processing with histogram, centroid, and variance analysis. Published in Springer."
        highlights:
