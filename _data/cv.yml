cv:
  name: Ramendra Kumar
  label: SDE-II at Microsoft
  email: kumarramendra154@gmail.com
  location: Hyderabad, India
  image: ""
  summary: "AI Systems Engineer with deep systems-software roots, building reliable AI from the silicon up. Currently at Microsoft on Windows Update delivery, GPU driver and runtime reliability for Surface devices, and a production agentic AI platform for fleet diagnostics. Focus: distributed ML, LLM inference, and the systems that make AI reliable at scale."

  social_networks:
    - network: GitHub
      username: ramendra-k
    - network: LinkedIn
      username: ramendra-k

  sections:
    Experience:
      - company: Microsoft
        position: SDE-II
        start_date: 2024-07
        end_date: "Now"
        summary: Windows Updates for Surface Devices
        highlights:
          - "Own update health and release readiness across 9 ARM-based Surface SKUs, shipping monthly Windows Update releases to millions of devices through saturation-based rollout gating."
          - "Root-cause NPU and AI-accelerator silicon failures on Copilot+ Surface devices through hardware-level debugging and telemetry forensics, partnering with silicon and firmware teams to unblock on-device AI inference workloads."
          - "Designed core components of HealthSenseAI, a production agentic AI platform built on Azure OpenAI with causal RCA, bounded remediation, and safety guardrails, recognized with Microsoft's Engineering Excellence Award for taking it from POC to production."
          - "Designed and shipped PLE Echo, an internal RAG + fine-tuned LLM assistant adopted across the team for engineer onboarding and operational Q&A."
          - "Built fleet-scale observability and device-farm validation workflows over Surface telemetry, catching driver, firmware, and silicon regressions pre-rollout and preventing brick-class failures from reaching customer devices."

      - company: Samsung R&D
        position: Senior Software Engineer
        start_date: 2022-01
        end_date: 2024-06
        summary: Android Camera Framework
        highlights:
          - "Worked on the image processing pipeline for ExpertRaw, Samsung's flagship camera application, at the Android framework layer."
          - "Designed a cloud-based compute offloading service for image rendering, enabling high-quality imaging on devices with limited processing power."
          - "Designed and developed capture and processing frameworks for high-resolution photography with optimized memory management."
          - "Engineered scheduling and processing optimizations for the camera pipeline."
          - "Developed Astrography and multi-exposure capture modes shipped in flagship device releases."

      - company: BigGrocers
        position: Software Engineer
        start_date: 2021-07
        end_date: 2021-12
        highlights:
          - "Designed and implemented backend services for order management, tracking, and payment gateway integration."

      - company: Qualcomm
        position: Associate Software Engineer
        start_date: 2019-09
        end_date: 2021-01
        highlights:
          - "Optimized display driver algorithms for low-cost chipsets, improving refresh rate and enabling higher-quality display output on budget hardware."
          - "Worked at the hardware-software co-optimization layer, interfacing with graphics and display hardware."

