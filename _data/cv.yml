  sections:
    Experience:
      - company: Microsoft
        position: SDE-II
        start_date: 2024-07
        end_date: "Present"
        summary: Windows Update Delivery — Surface ARM Devices
        highlights:
          - "Ship Windows Updates to ARM-based Surface devices, ensuring update health and build pipeline reliability across multiple SKUs and chipsets."
          - "Drive device reliability by analyzing large-scale telemetry data to identify failure patterns, diagnose firmware and software issues, and validate fixes before broad rollout."
          - "Built HealthSenseAI, an AI-powered device health monitoring platform with autonomous remediation capabilities — uses agentic AI to detect, diagnose, and resolve device issues automatically."
          - "Debugged NPU (Neural Processing Unit) issues on AI-accelerator silicon, root-causing hardware and driver-level failures through telemetry analysis."
          - "Built an internal AI assistant for engineer onboarding using LLM fine-tuning and retrieval-augmented generation (RAG)."
          - "Mentor new-hire engineers on team workflows and tooling."

      - company: Samsung R&D
        position: Senior Software Engineer
        start_date: 2022-01
        end_date: 2024-06
        summary: ExpertRaw Camera App — Image Processing Framework
        highlights:
          - "Worked on the image processing pipeline for ExpertRaw, Samsung's flagship camera application, at the Android framework layer."
          - "Designed a cloud-based compute offloading service for image rendering, enabling high-quality imaging on devices with limited processing power."
          - "Built capture and processing frameworks for high-resolution photography with optimized memory management."
          - "Engineered scheduling and processing optimizations for the camera pipeline."
          - "Developed Astrography and multi-exposure capture modes shipped in flagship device releases."

      - company: BigGrocers
        position: Software Engineer
        start_date: 2021-07
        end_date: 2021-12
        highlights:
          - "Built backend services for order management, tracking, and payment gateway integration."

      - company: Qualcomm
        position: Associate Software Engineer
        start_date: 2019-09
        end_date: 2021-01
        highlights:
          - "Optimized display driver algorithms for low-cost chipsets, improving refresh rate and enabling higher-quality display output on budget hardware."
          - "Worked at the hardware-software co-optimization layer, interfacing with display hardware and HDMI protocols."

